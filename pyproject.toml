[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "council"
version = "0.1.0"
description = "A council of AI models debates your topic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Council Team" }
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "typer>=0.12",
    "tomli_w>=1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
council = "council.cli:main"
